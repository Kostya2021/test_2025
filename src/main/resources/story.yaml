storyElements:
  - id: 1
    avatar: ADVISOR
    lines:
      - Congratulations to your new role as Junior Project Manager!
      - Now let's show them how to get projects done, shall we?
      - For a beginning, just ACCEPT some low-risk projects from the PROJECT MARKET!
  - id: 2
    avatar: ADVISOR
    afterObjective: 1
    medium: MESSENGER
    lines:
      - Excellent work! 😃👍
      - The CEO is pleased with your bottom line. You received an additional 75K budget to build up your team!
  - id: 3
    avatar: BADGUY
    afterObjective: 1
    earliestOccurrence: 150
    lines:
      - Ha! You think you're the best because you finished some easy-peasy projects, huh?
      - Better watch your back...
  - id: 4
    avatar: ADVISOR
    afterObjective: 1
    earliestOccurrence: 170
    lines:
      - Being successful will always attract envious people.
      - Don't worry! She probably won't do anything crazy to stop you. At least for now...
  - id: 5
    avatar: ADVISOR
    earliestOccurrence: 500
    lines:
      - Hey! You still here?
      - Seriously, you should get outside!
  - id: 6
    avatar: ADVISOR
    earliestOccurrence: 700
    lines:
      - Nothing is happening here anymore, so...
      - Maybe go back to the survey...?
      - Yes, definitely go back to the survey, now!
      - You've probably set a new high score already.